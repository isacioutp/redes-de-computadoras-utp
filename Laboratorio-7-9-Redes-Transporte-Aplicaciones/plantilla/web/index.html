<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>PagosYA · Portal</title>
</head>
<body>
  <h1>PagosYA — portal (servido por nginx)</h1>
  <form id="f">
    <input id="monto" type="number" step="0.01" placeholder="Monto" required />
    <input id="cliente" placeholder="Cliente (opcional)" />
    <button type="submit">Pagar</button>
  </form>
  <pre id="salida"></pre>
  <script>
    const f = document.getElementById('f');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const r = await fetch('http://localhost:8088/pagos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            monto: parseFloat(document.getElementById('monto').value),
            cliente: document.getElementById('cliente').value || 'anonimo'
          })
        });
        document.getElementById('salida').textContent = JSON.stringify(await r.json(), null, 2);
      } catch (err) {
        document.getElementById('salida').textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
