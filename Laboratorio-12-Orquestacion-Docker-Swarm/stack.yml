services:
  web:
    image: nginx:alpine
    ports: ["8090:80"]
    networks: [meshnet]
    deploy:
      replicas: 2
      update_config:
        order: start-first

  api:
    image: python:3.11-slim
    command: python -c "import time; print('API cluster'); time.sleep(3600)"
    networks: [meshnet]
    deploy:
      replicas: 3

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: labpass123
    networks: [meshnet]
    deploy:
      placement:
        constraints: [node.role == manager]
    volumes: [pgdata:/var/lib/postgresql/data]

networks:
  meshnet:
    driver: overlay

volumes:
  pgdata: {}
